<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fff8d6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Transliteration" />

    <!-- Primary Meta Tags -->
    <title>Transliteration</title>
    <meta name="title" content="Transliteration" />
    <meta name="description" content="Drop in Cyrillic or Latin text, pick a conversion route, and get the transformed output easy peasy. " />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://r37r0m0d3l.github.io/translit-ed/" />
    <meta property="og:title" content="Transliteration" />
    <meta property="og:description" content="Drop in Cyrillic or Latin text, pick a conversion route, and get the transformed output easy peasy. " />
    <meta property="og:image" content="https://metatags.io/images/meta-tags.png" />

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://r37r0m0d3l.github.io/translit-ed/" />
    <meta property="twitter:title" content="Transliteration" />
    <meta property="twitter:description" content="Drop in Cyrillic or Latin text, pick a conversion route, and get the transformed output easy peasy. " />
    <meta property="twitter:image" content="https://metatags.io/images/meta-tags.png" />

    <!-- Standard browser tabs and bookmarks. -->
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/16.png" />
    <!-- Recommended by Google for search results. -->
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/48.png" />
    <!-- Apple Touch Icon for iOS devices. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/180.png" />
    <!--  Android Chrome. -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/192.png" />
    <!-- Progressive Web Apps (PWA) and splash screens -->
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/512.png" />

    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main>
      <section class="frame">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-live="polite"> Dark mode </button>
        <header class="hero">
          <div class="intro">
            <h3>Translit</h3>
            <p class="subtitle">
              Drop in Cyrillic or Latin text, pick a conversion route, and get the transformed output easy peasy.
            </p>
          </div>
        </header>

        <div class="grid">
          <div class="field field--from">
            <label for="from">Source text · up to 10,000 symbols</label>
            <textarea id="from" spellcheck="false" placeholder="Paste text here"></textarea>
          </div>

          <div class="field field--to">
            <select id="to"></select>
          </div>

          <div class="field field--result">
            <label for="result">Converted output</label>
            <textarea id="result" spellcheck="false" readonly placeholder="Transformation output"></textarea>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./index.js"></script>
  </body>
</html>
