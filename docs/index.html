<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>translit-ed docs</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f7fb;
        color: #111827;
      }

      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(220px, 0.7fr) minmax(0, 1.4fr);
        gap: 16px;
        align-items: stretch;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 14px;
        font-weight: 600;
      }

      textarea,
      select {
        width: 100%;
        border: 1px solid #d0d7e2;
        border-radius: 12px;
        padding: 14px 16px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      textarea {
        min-height: 70vh;
        resize: vertical;
      }

      select {
        min-height: 52px;
      }

      @media (max-width: 980px) {
        .grid {
          grid-template-columns: 1fr;
        }

        textarea {
          min-height: 28vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Translit</h1>

      <div class="grid">
        <div class="field">
          <label for="from">FROM</label>
          <textarea id="from" spellcheck="false" placeholder="Paste text here"></textarea>
        </div>

        <div class="field">
          <label for="to">TO</label>
          <select id="to"></select>
        </div>

        <div class="field">
          <label for="result">RESULT</label>
          <textarea id="result" spellcheck="false" readonly placeholder="Transformation output"></textarea>
        </div>
      </div>
    </main>

    <script type="module">
      import * as translitEd from "./translit-ed.js";

      const fromInput = document.querySelector("#from");
      const toSelect = document.querySelector("#to");
      const resultInput = document.querySelector("#result");

      const humanizeName = (name) =>
        name
          .replace(/([a-z])([A-Z])/g, "$1 $2")
          .replace(/\b\w/g, (char) => char.toUpperCase());

      const transformationGroups = [
        {
          flag: "🇧🇾",
          language: "Belarusian",
          options: ["cyrillicBelarusianToLatin", "latinToCyrillicBelarusian"],
        },
        {
          flag: "🇧🇬",
          language: "Bulgarian",
          options: ["cyrillicBulgarianToLatin", "latinToCyrillicBulgarian"],
        },
        {
          flag: "🇰🇿",
          language: "Kazakh",
          options: ["cyrillicKazakhToLatin", "latinToCyrillicKazakh"],
        },
        {
          flag: "🇲🇰",
          language: "Macedonian",
          options: ["cyrillicMacedonianToLatin", "latinToCyrillicMacedonian"],
        },
        {
          flag: "🇲🇳",
          language: "Mongolian",
          options: ["cyrillicMongolianToLatin", "latinToCyrillicMongolian"],
        },
        {
          flag: "🇷🇺",
          language: "Russian",
          options: ["cyrillicRussianToLatin", "latinToCyrillicRussian"],
        },
        {
          flag: "🇷🇸",
          language: "Serbian",
          options: ["cyrillicSerbianToLatin", "latinToCyrillicSerbian"],
        },
        {
          flag: "🇺🇦",
          language: "Ukrainian",
          options: [
            "cyrillicUkrainianToLatin",
            "latinToCyrillicUkrainian",
            "ukrainianCyrillicToLatynka",
            "ukrainianLatynkaToCyrillic",
          ],
        },
        {
          flag: "🇺🇿",
          language: "Uzbek",
          options: ["cyrillicUzbekToLatin", "latinToCyrillicUzbek"],
        },
        {
          flag: "🌐",
          language: "Unicode",
          options: ["cyrillicToLatinUnicode", "latinToCyrillicUnicode"],
        },
      ];

      for (const group of transformationGroups) {
        const optgroup = document.createElement("optgroup");
        optgroup.label = `${group.flag} ${group.language}`;

        for (const name of group.options) {
          if (typeof translitEd[name] !== "function") {
            continue;
          }

          const option = document.createElement("option");
          option.value = name;
          option.textContent = humanizeName(name);
          optgroup.append(option);
        }

        if (optgroup.childElementCount > 0) {
          toSelect.append(optgroup);
        }
      }

      toSelect.value = "cyrillicBelarusianToLatin";

      const renderResult = () => {
        const transform = translitEd[toSelect.value];
        resultInput.value = typeof transform === "function" ? transform(fromInput.value) : "";
      };

      fromInput.addEventListener("input", renderResult);
      toSelect.addEventListener("change", renderResult);
      renderResult();
    </script>
  </body>
</html>
