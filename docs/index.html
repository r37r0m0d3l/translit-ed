<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Translit</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <main>
      <section class="frame">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-live="polite"> Dark mode </button>
        <header class="hero">
          <div class="intro">
            <h3>Translit</h3>
            <p class="subtitle">
              Drop in Cyrillic or Latin text, pick a conversion route, and get the transformed output easy peasy.
            </p>
          </div>
        </header>

        <div class="grid">
          <div class="field field--from">
            <label for="from">Source text · up to 10,000 symbols</label>
            <textarea id="from" spellcheck="false" placeholder="Paste text here"></textarea>
          </div>

          <div class="field field--to">
            <select id="to"></select>
          </div>

          <div class="field field--result">
            <label for="result">Converted output</label>
            <textarea id="result" spellcheck="false" readonly placeholder="Transformation output"></textarea>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./index.js"></script>
  </body>
</html>
